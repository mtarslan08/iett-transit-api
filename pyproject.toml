[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iett-tracker"
version = "0.1.0"
description = "İETT canlı otobüs verileri için sağlayıcı-bağımsız backend"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "pydantic-settings>=2.5", "zeep>=4.3", "beautifulsoup4>=4.12"]

[tool.setuptools.packages.find]
where = ["src"]
